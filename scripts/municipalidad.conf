<VirtualHost *:80>
    ServerName munihuanuco.gob.pe
    ServerAlias www.munihuanuco.gob.pe
    ServerAdmin webmaster@munihuanuco.gob.pe
    DocumentRoot /var/www/municipalidad/html

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/municipalidad_error.log
    CustomLog ${APACHE_LOG_DIR}/municipalidad_access.log combined

    # Frontend - React App
    <Directory "/var/www/municipalidad/html">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Rewrite para React Router
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Proxy para Backend API
    ProxyPreserveHost On
    ProxyPass /api/ http://localhost:5000/
    ProxyPassReverse /api/ http://localhost:5000/

    # Proxy para ML Service
    ProxyPass /ml-api/ http://localhost:5001/
    ProxyPassReverse /ml-api/ http://localhost:5001/

    # Headers de seguridad
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
</VirtualHost>

<VirtualHost *:443>
    ServerName munihuanuco.gob.pe
    ServerAlias www.munihuanuco.gob.pe
    DocumentRoot /var/www/municipalidad/html

    # SSL Configuration - Let's Encrypt
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/munihuanuco.gob.pe/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/munihuanuco.gob.pe/privkey.pem

    # Protocolos SSL seguros
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/municipalidad_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/municipalidad_ssl_access.log combined

    # Frontend - React App
    <Directory "/var/www/municipalidad/html">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Rewrite para React Router
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Proxy para Backend API
    ProxyPreserveHost On
    ProxyPass /api/ http://localhost:5000/
    ProxyPassReverse /api/ http://localhost:5000/

    # Configuración específica del proxy
    ProxyTimeout 300
    <Proxy http://localhost:5000>
        Require all granted
    </Proxy>

    # Proxy para ML Service
    ProxyPass /ml-api/ http://localhost:5001/
    ProxyPassReverse /ml-api/ http://localhost:5001/

    <Proxy http://localhost:5001>
        Require all granted
    </Proxy>

    # Headers de seguridad
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>